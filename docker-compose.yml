services:
  slotwise:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slotwise-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:////app/data/slotwise.db
      - SERVE_STATIC_SPA=true
      - CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173
    volumes:
      - slotwise-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  slotwise-data:
    driver: local
